<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forisa Impact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <img src="logo.png" alt="Forisa Logo" class="logo">

    <div class="header-text">
      <h1>PT Forisa Abadijaya Sejahtera</h1>
      <p>Membantu Organisasi Bertumbuh Lewat SDM yang Selaras</p>
    </div>
  </div>
</header>

<nav class="nav">
  <a href="#" data-target="tentang">Tentang Kami</a>
  <a href="#" data-target="layanan">Pelayanan Kami</a>
  <a href="#" data-target="konsultasi">Konsultasi Awal</a>
</nav>

<main>
  <section id="tentang" class="page-section active">
    <!-- ISI TENTANG KAMI — PASTE ISI LO DI SINI -->
  </section>

  <section id="layanan" class="page-section">
    <!-- ISI PELAYANAN KAMI — PASTE ISI LO DI SINI -->
  </section>

  <section id="konsultasi" class="page-section">
    <p>Silakan ajukan konsultasi awal untuk mendiskusikan kebutuhan organisasi Anda.</p>
    <button id="btnKonsultasi">Ajukan Konsultasi</button>
  </section>
</main>

<footer class="footer">
  © 2026 Forisa Impact — PT Forisa Abadijaya Sejahtera
</footer>

<script>
document.querySelectorAll('.nav a').forEach(link => {
  link.addEventListener('click', e => {
    e.preventDefault();

    document.querySelectorAll('.page-section')
      .forEach(sec => sec.classList.remove('active'));

    const target = link.getAttribute('data-target');
    document.getElementById(target).classList.add('active');
  });
});

document.getElementById("btnKonsultasi").addEventListener("click", function () {
  const phone = "6281225047599";
  const message = encodeURIComponent("Halo Forisa, saya ingin menjadwalkan konsultasi awal.");
  window.open(`https://wa.me/${phone}?text=${message}`, "_blank");
});
</script>

</body>
</html>
